services:
  - type: web
    name: campusequip
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build:client
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/campusequip.db
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
    disk:
      name: campusequip-data
      mountPath: /var/data
      sizeGB: 1
