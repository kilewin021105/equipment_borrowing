[variables]
NODE_ENV = "production"
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["...", "python3", "gcc", "gnumake"]

[phases.install]
cmds = [
  "npm install --prefix server"
]

[phases.build]
cmds = [
  "npm install --prefix client",
  "npm run build:client"
]

[start]
cmd = "node server/startup.js"